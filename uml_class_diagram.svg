<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.3"/>
    </marker>
    <marker id="diamond" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="20" markerHeight="12" orient="auto">
      <path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#fff" stroke="#222" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1040" height="640" fill="#fff"/>

  <text x="20" y="30" font-weight="bold" font-size="15">P6_FadilSalleh</text>
  <text x="1020" y="30" text-anchor="end" font-size="13" fill="#555">INF1103 Lab 6 – UML Class Diagram</text>
  <line x1="20" y1="40" x2="1020" y2="40" stroke="#bbb"/>

  <g transform="translate(0,40)">

  <!-- inventory_manager (main program) -->
  <g>
    <rect x="20" y="20" width="460" height="212" fill="#f4f7fb" stroke="#222" stroke-width="1.5"/>
    <text x="250" y="38" text-anchor="middle" font-style="italic">«module»</text>
    <text x="250" y="56" text-anchor="middle" font-weight="bold" font-size="13">inventory_manager (main program)</text>
    <line x1="20" y1="64" x2="480" y2="64" stroke="#222"/>
    <text x="30" y="83">  INVENTORY_FILE : str</text>
    <line x1="20" y1="94" x2="480" y2="94" stroke="#222"/>
    <text x="30" y="113">+ main() : void</text>
    <text x="30" y="131">+ show_menu() : void</text>
    <text x="30" y="149">+ handle_add(inventory: Inventory) : void</text>
    <text x="30" y="167">+ handle_update(inventory: Inventory) : void</text>
    <text x="30" y="185">+ handle_search(inventory: Inventory) : void</text>
    <text x="30" y="203">+ get_non_negative_int(prompt: str) : int | None</text>
    <text x="30" y="221">+ get_non_negative_float(prompt: str) : float | None</text>
  </g>

  <!-- inventory_storage (file handling) -->
  <g>
    <rect x="560" y="20" width="460" height="106" fill="#f4f7fb" stroke="#222" stroke-width="1.5"/>
    <text x="790" y="38" text-anchor="middle" font-style="italic">«module»</text>
    <text x="790" y="56" text-anchor="middle" font-weight="bold" font-size="13">inventory_storage (file handling)</text>
    <line x1="560" y1="64" x2="1020" y2="64" stroke="#222"/>
    <line x1="560" y1="78" x2="1020" y2="78" stroke="#222"/>
    <text x="570" y="97">+ load_inventory(file_path: str) : Inventory</text>
    <text x="570" y="115">+ save_inventory(inventory: Inventory, file_path: str) : void</text>
  </g>

  <!-- Inventory class -->
  <g>
    <rect x="20" y="300" width="460" height="252" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="250" y="320" text-anchor="middle" font-weight="bold" font-size="13">Inventory</text>
    <line x1="20" y1="330" x2="480" y2="330" stroke="#222"/>
    <text x="30" y="349">- __products : list[Product]</text>
    <text x="30" y="367">- __history : list[dict]</text>
    <line x1="20" y1="378" x2="480" y2="378" stroke="#222"/>
    <text x="30" y="397">+ __init__()</text>
    <text x="30" y="415">+ add_product(product: Product) : bool</text>
    <text x="30" y="433">+ search_product(product_id: str) : Product | None</text>
    <text x="30" y="451">+ update_stock(product_id: str, new_stock: int) : bool</text>
    <text x="30" y="469">+ display_all() : void</text>
    <text x="30" y="487">+ get_products() : list[Product]</text>
    <text x="30" y="505">+ get_history() : list[dict]</text>
    <text x="30" y="523">+ load_history(history: list[dict]) : void</text>
    <text x="30" y="541">- __record_transaction(product_id, action, amount) : void</text>
  </g>

  <!-- Product class -->
  <g>
    <rect x="560" y="300" width="460" height="252" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="790" y="320" text-anchor="middle" font-weight="bold" font-size="13">Product</text>
    <line x1="560" y1="330" x2="1020" y2="330" stroke="#222"/>
    <text x="570" y="349">- __product_id : str</text>
    <text x="570" y="367">- __name : str</text>
    <text x="570" y="385">- __price : float</text>
    <text x="570" y="403">- __stock : int</text>
    <line x1="560" y1="414" x2="1020" y2="414" stroke="#222"/>
    <text x="570" y="433">+ __init__(product_id, name, price, stock)</text>
    <text x="570" y="451">+ get_product_id() : str</text>
    <text x="570" y="469">+ get_name() : str</text>
    <text x="570" y="487">+ get_price() : float</text>
    <text x="570" y="505">+ get_stock() : int</text>
    <text x="570" y="523">+ update_stock(quantity: int) : bool</text>
    <text x="570" y="541">+ display_information() : void</text>
  </g>

  <!-- Relationships -->
  <g stroke="#222" stroke-width="1.3" fill="none">
    <!-- Inventory aggregates Products -->
    <line x1="480" y1="440" x2="560" y2="440" marker-start="url(#diamond)" marker-end="url(#open-arrow)"/>
    <!-- dependencies -->
    <line x1="250" y1="232" x2="250" y2="300" stroke-dasharray="6 4" marker-end="url(#open-arrow)"/>
    <line x1="480" y1="72" x2="560" y2="72" stroke-dasharray="6 4" marker-end="url(#open-arrow)"/>
    <line x1="480" y1="200" x2="620" y2="300" stroke-dasharray="6 4" marker-end="url(#open-arrow)"/>
    <line x1="600" y1="126" x2="420" y2="300" stroke-dasharray="6 4" marker-end="url(#open-arrow)"/>
    <line x1="790" y1="126" x2="790" y2="300" stroke-dasharray="6 4" marker-end="url(#open-arrow)"/>
  </g>
  <g font-size="11" font-style="italic" fill="#333">
    <text x="532" y="432" text-anchor="middle" font-style="normal">0..*</text>
    <text x="258" y="270">«uses»</text>
    <text x="520" y="64" text-anchor="middle">«uses»</text>
    <text x="610" y="270">«creates»</text>
    <text x="400" y="268">«creates»</text>
    <text x="798" y="215">«creates»</text>
  </g>

  <text x="20" y="585" font-size="11" fill="#555">INF1103 Lab 6 – OOP Inventory Management System.  ◇── aggregation (Inventory holds 0..* Products)   - - -&gt; dependency (uses / creates)</text>
  </g>
</svg>
