<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1580" height="1190" viewBox="0 0 1580 1190" font-family="Consolas, 'Courier New', monospace" font-size="12">
  <defs>
    <marker id="open-arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#222" stroke-width="1.3"/>
    </marker>
    <marker id="hollow-diamond" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="20" markerHeight="12" orient="auto">
      <path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#fff" stroke="#222" stroke-width="1.3"/>
    </marker>
    <marker id="filled-diamond" viewBox="0 0 20 12" refX="1" refY="6" markerWidth="20" markerHeight="12" orient="auto">
      <path d="M1,6 L10,1 L19,6 L10,11 Z" fill="#222" stroke="#222" stroke-width="1.3"/>
    </marker>
    <marker id="triangle" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#222" stroke-width="1.3" stroke-dasharray="none"/>
    </marker>
  </defs>
  <rect width="1580" height="1190" fill="#fff"/>

  <text x="20" y="30" font-weight="bold" font-size="15">P6_FadilSalleh</text>
  <text x="1560" y="30" text-anchor="end" font-size="13" fill="#555">INF1103 Lab 8 – UML Class Diagram (Association, Aggregation, Composition, Inheritance)</text>
  <line x1="20" y1="40" x2="1560" y2="40" stroke="#bbb"/>

  <!-- Inventory -->
  <g>
    <rect x="480" y="60" width="560" height="270" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="760" y="80" text-anchor="middle" font-weight="bold" font-size="13">Inventory</text>
    <line x1="480" y1="90" x2="1040" y2="90" stroke="#222"/>
    <text x="490" y="109">- __products : Product [0..*]</text>
    <text x="490" y="127">- __history : Dictionary [0..*]</text>
    <line x1="480" y1="138" x2="1040" y2="138" stroke="#222"/>
    <text x="490" y="157">+ __init__()</text>
    <text x="490" y="175">+ add_product(product: Product) : Boolean</text>
    <text x="490" y="193">+ remove_product(product_id: String) : Product [0..1]</text>
    <text x="490" y="211">+ find_product(product_id: String) : Product [0..1]</text>
    <text x="490" y="229">+ update_stock(product_id: String, new_stock: Integer) : Boolean</text>
    <text x="490" y="247">+ display_all() : void</text>
    <text x="490" y="265">+ get_products() : Product [0..*]</text>
    <text x="490" y="283">+ get_history() : Dictionary [0..*]</text>
    <text x="490" y="301">+ load_history(history: Dictionary [0..*]) : void</text>
    <text x="490" y="319">- __record_transaction(product_id: String, action: String, amount: Integer) : void</text>
  </g>

  <!-- Product (abstract) -->
  <g>
    <rect x="480" y="430" width="560" height="338" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="760" y="448" text-anchor="middle">&lt;&lt;abstract&gt;&gt;</text>
    <text x="760" y="466" text-anchor="middle" font-weight="bold" font-style="italic" font-size="13">Product</text>
    <line x1="480" y1="474" x2="1040" y2="474" stroke="#222"/>
    <text x="490" y="493">- __product_id : String</text>
    <text x="490" y="511">- __name : String</text>
    <text x="490" y="529">- __price : Float</text>
    <text x="490" y="547">- __stock : Integer</text>
    <text x="490" y="565">- __supplier : Supplier</text>
    <line x1="480" y1="576" x2="1040" y2="576" stroke="#222"/>
    <text x="490" y="595">+ __init__(product_id: String, name: String, price: Float,</text>
    <text x="563" y="613">stock: Integer, supplier: Supplier)</text>
    <text x="490" y="631">+ get_product_id() : String</text>
    <text x="490" y="649">+ get_name() : String</text>
    <text x="490" y="667">+ get_price() : Float</text>
    <text x="490" y="685">+ get_stock() : Integer</text>
    <text x="490" y="703">+ get_supplier() : Supplier</text>
    <text x="490" y="721">+ update_stock(quantity: Integer) : Boolean</text>
    <text x="490" y="739">+ display_information() : void</text>
    <text x="490" y="757" font-style="italic">+ get_fulfilment_info() : String  {abstract}</text>
  </g>

  <!-- Supplier -->
  <g>
    <rect x="20" y="470" width="390" height="216" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="215" y="490" text-anchor="middle" font-weight="bold" font-size="13">Supplier</text>
    <line x1="20" y1="500" x2="410" y2="500" stroke="#222"/>
    <text x="30" y="519">- __supplier_id : String</text>
    <text x="30" y="537">- __name : String</text>
    <text x="30" y="555">- __contact_email : String</text>
    <line x1="20" y1="566" x2="410" y2="566" stroke="#222"/>
    <text x="30" y="585">+ __init__(supplier_id: String, name: String,</text>
    <text x="103" y="603">contact_email: String)</text>
    <text x="30" y="621">+ get_supplier_id() : String</text>
    <text x="30" y="639">+ get_name() : String</text>
    <text x="30" y="657">+ get_contact_email() : String</text>
    <text x="30" y="675">+ display_information() : void</text>
  </g>

  <!-- Order -->
  <g>
    <rect x="1140" y="60" width="420" height="216" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1350" y="80" text-anchor="middle" font-weight="bold" font-size="13">Order</text>
    <line x1="1140" y1="90" x2="1560" y2="90" stroke="#222"/>
    <text x="1150" y="109">- __order_id : String</text>
    <text x="1150" y="127">- __order_lines : OrderLine [0..*]</text>
    <line x1="1140" y1="138" x2="1560" y2="138" stroke="#222"/>
    <text x="1150" y="157">+ __init__(order_id: String)</text>
    <text x="1150" y="175">+ get_order_id() : String</text>
    <text x="1150" y="193">+ add_order_line(product: Product, quantity: Integer) : void</text>
    <text x="1150" y="211">+ remove_order_line(product_id: String) : Boolean</text>
    <text x="1150" y="229">+ get_order_lines() : OrderLine [0..*]</text>
    <text x="1150" y="247">+ calculate_total() : Float</text>
    <text x="1150" y="265">+ display_order() : void</text>
  </g>

  <!-- OrderLine -->
  <g>
    <rect x="1140" y="470" width="420" height="180" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1350" y="490" text-anchor="middle" font-weight="bold" font-size="13">OrderLine</text>
    <line x1="1140" y1="500" x2="1560" y2="500" stroke="#222"/>
    <text x="1150" y="519">- __product : Product</text>
    <text x="1150" y="537">- __quantity : Integer</text>
    <line x1="1140" y1="548" x2="1560" y2="548" stroke="#222"/>
    <text x="1150" y="567">+ __init__(product: Product, quantity: Integer)</text>
    <text x="1150" y="585">+ get_product() : Product</text>
    <text x="1150" y="603">+ get_quantity() : Integer</text>
    <text x="1150" y="621">+ calculate_subtotal() : Float</text>
    <text x="1150" y="639">+ display_information() : void</text>
  </g>

  <!-- CanBeShipped (interface) -->
  <g>
    <rect x="1240" y="720" width="320" height="88" fill="#fffaf0" stroke="#222" stroke-width="1.5"/>
    <text x="1400" y="738" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="1400" y="756" text-anchor="middle" font-weight="bold" font-style="italic" font-size="13">CanBeShipped</text>
    <line x1="1240" y1="764" x2="1560" y2="764" stroke="#222"/>
    <line x1="1240" y1="778" x2="1560" y2="778" stroke="#222"/>
    <text x="1250" y="797" font-style="italic">+ calculate_shipping_cost() : Float</text>
  </g>

  <!-- DigitalProduct -->
  <g>
    <rect x="200" y="900" width="520" height="162" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="460" y="920" text-anchor="middle" font-weight="bold" font-size="13">DigitalProduct</text>
    <line x1="200" y1="930" x2="720" y2="930" stroke="#222"/>
    <text x="210" y="949">- __download_size : Float</text>
    <line x1="200" y1="960" x2="720" y2="960" stroke="#222"/>
    <text x="210" y="979">+ __init__(product_id: String, name: String, price: Float,</text>
    <text x="283" y="997">stock: Integer, supplier: Supplier, download_size: Float)</text>
    <text x="210" y="1015">+ get_download_size() : Float</text>
    <text x="210" y="1033">+ display_information() : void</text>
    <text x="210" y="1051">+ get_fulfilment_info() : String</text>
  </g>

  <!-- PhysicalProduct -->
  <g>
    <rect x="780" y="900" width="520" height="216" fill="#fff" stroke="#222" stroke-width="1.5"/>
    <text x="1040" y="920" text-anchor="middle" font-weight="bold" font-size="13">PhysicalProduct</text>
    <line x1="780" y1="930" x2="1300" y2="930" stroke="#222"/>
    <text x="790" y="949">- __weight : Float</text>
    <text x="790" y="967" text-decoration="underline">+ BASE_SHIPPING_COST : Float = 5.00</text>
    <text x="790" y="985" text-decoration="underline">+ SHIPPING_COST_PER_KG : Float = 2.00</text>
    <line x1="780" y1="996" x2="1300" y2="996" stroke="#222"/>
    <text x="790" y="1015">+ __init__(product_id: String, name: String, price: Float,</text>
    <text x="863" y="1033">stock: Integer, supplier: Supplier, weight: Float)</text>
    <text x="790" y="1051">+ get_weight() : Float</text>
    <text x="790" y="1069">+ display_information() : void</text>
    <text x="790" y="1087">+ get_fulfilment_info() : String</text>
    <text x="790" y="1105">+ calculate_shipping_cost() : Float</text>
  </g>

  <!-- Relationships -->
  <g stroke="#222" stroke-width="1.3" fill="none">
    <!-- Aggregation: Inventory (whole, hollow diamond) holds Products -->
    <line x1="760" y1="330" x2="760" y2="430" marker-start="url(#hollow-diamond)"/>
    <!-- Composition: Order (whole, filled diamond) owns OrderLines -->
    <line x1="1350" y1="276" x2="1350" y2="470" marker-start="url(#filled-diamond)"/>
    <!-- Association: Product refers to its Supplier (arrow shows navigability) -->
    <line x1="480" y1="560" x2="410" y2="560" marker-end="url(#open-arrow)"/>
    <!-- Association: OrderLine refers to a Product -->
    <line x1="1140" y1="600" x2="1040" y2="600" marker-end="url(#open-arrow)"/>
    <!-- Inheritance / generalisation -->
    <path d="M460,900 V850 H1040 V900"/>
    <line x1="760" y1="850" x2="760" y2="768" marker-end="url(#triangle)"/>
    <!-- Interface realisation -->
    <line x1="1230" y1="900" x2="1400" y2="808" stroke-dasharray="7 4" marker-end="url(#triangle)"/>
  </g>
  <g font-size="11" fill="#333">
    <text x="768" y="350">0..1</text>
    <text x="768" y="424">0..*</text>
    <text x="1358" y="300">1</text>
    <text x="1358" y="464">0..*</text>
    <text x="418" y="552">1</text>
    <text x="474" y="552" text-anchor="end">0..*</text>
    <text x="1134" y="592" text-anchor="end">0..*</text>
    <text x="1048" y="592">1</text>
  </g>
  <g font-size="10" font-style="italic" fill="#555">
    <text x="445" y="576" text-anchor="middle">supplied by</text>
    <text x="1090" y="616" text-anchor="middle">refers to</text>
    <text x="772" y="388">contains</text>
    <text x="1362" y="382">owns</text>
  </g>

  <g font-size="11" fill="#555">
    <text x="20" y="1150">Notation:  ──▷ inheritance   - -▷ interface realisation   ◇── aggregation (whole end)   ◆── composition (whole end)   ──&gt; association (arrow = navigable direction)</text>
    <text x="20" y="1168">Types are language-independent: String, Integer, Float, Boolean; Type [0..*] = collection, Type [0..1] = optional (may be none). Italic = abstract, underlined = class (static) attribute.</text>
  </g>
</svg>
